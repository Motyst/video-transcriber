<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Transcriber</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f1a; color: #e0e0f0; min-height: 100vh; padding: 2rem 1rem; }
.container { max-width: 820px; margin: 0 auto; }
h1 { font-size: 1.7rem; margin-bottom: 0.3rem; color: #c084fc; }
.subtitle { color: #6b6b8a; margin-bottom: 2rem; font-size: 0.9rem; }
.card { background: #16162a; border: 1px solid #2a2a45; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
.tab { padding: 0.45rem 1rem; border: 1px solid #2a2a45; border-radius: 6px; cursor: pointer; background: transparent; color: #9090b0; font-size: 0.9rem; transition: all 0.15s; }
.tab.active { background: #c084fc; border-color: #c084fc; color: #fff; }
.input-group { margin-bottom: 1rem; }
label { display: block; margin-bottom: 0.35rem; font-size: 0.82rem; color: #7070a0; text-transform: uppercase; letter-spacing: 0.05em; }
input[type="url"], select {
  width: 100%; padding: 0.6rem 0.8rem;
  border: 1px solid #2a2a45; border-radius: 7px;
  background: #0c0c1a; color: #e0e0f0;
  font-size: 0.95rem; outline: none; transition: border-color 0.15s;
}
input[type="url"]:focus, select:focus { border-color: #c084fc; }
input[type="file"] { width: 100%; color: #9090b0; font-size: 0.9rem; }
.options { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }
@media (max-width: 600px) { .options { grid-template-columns: 1fr; } }
.btn-primary {
  width: 100%; padding: 0.75rem;
  background: #c084fc; color: #fff;
  border: none; border-radius: 8px;
  font-size: 0.95rem; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover:not(:disabled) { background: #a855f7; }
.btn-primary:disabled { background: #3a3a5a; color: #6060a0; cursor: not-allowed; }
.status-card { display: none; }
.status-card.visible { display: block; }
.status-text { font-size: 0.9rem; color: #9090c0; padding: 0.1rem 0; }
.status-text.error { color: #f87171; }
.result-card { display: none; }
.result-card.visible { display: block; }
textarea {
  width: 100%; min-height: 280px;
  background: #0c0c1a; color: #d0d0e8;
  border: 1px solid #2a2a45; border-radius: 8px;
  padding: 1rem; font-family: 'Courier New', monospace;
  font-size: 0.875rem; line-height: 1.6; resize: vertical;
}
.result-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
.btn-sm {
  padding: 0.35rem 0.9rem;
  border: 1px solid #2a2a45; border-radius: 6px;
  cursor: pointer; background: #1e1e38; color: #c0c0e0;
  font-size: 0.82rem; transition: background 0.15s;
}
.btn-sm:hover { background: #2a2a4a; }
.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 2px solid #3a3a6a; border-top-color: #c084fc;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-right: 6px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
.progress-wrap { background: #0c0c1a; border-radius: 4px; height: 6px; overflow: hidden; margin-top: 0.75rem; }
.progress-bar { height: 100%; background: #c084fc; border-radius: 4px; transition: width 0.3s ease; width: 0%; }
.batch-downloads { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Video Transcriber</h1>
  <p class="subtitle">YouTube · Social media · Local files</p>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('url')">URL</button>
      <button class="tab" onclick="switchTab('file')">File(s)</button>
    </div>

    <div id="tab-url">
      <div class="input-group">
        <label>Video URL</label>
        <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=...">
      </div>
    </div>

    <div id="tab-file" style="display:none">
      <div class="input-group">
        <label>Video / Audio Files</label>
        <input type="file" id="file-input" multiple accept="video/*,audio/*,.mkv,.webm">
      </div>
    </div>

    <div class="options">
      <div class="input-group" style="margin-bottom:0">
        <label>Model</label>
        <select id="model-select">
          <option value="tiny">Tiny (fastest)</option>
          <option value="base" selected>Base</option>
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large-v3">Large v3 (best)</option>
        </select>
      </div>
      <div class="input-group" style="margin-bottom:0">
        <label>Output</label>
        <select id="format-select">
          <option value="txt" selected>Plain text</option>
          <option value="srt">SRT subtitles</option>
        </select>
      </div>
      <div class="input-group" style="margin-bottom:0">
        <label>Language</label>
        <select id="lang-select">
          <option value="">Auto-detect</option>
          <option value="en">English</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="it">Italian</option>
          <option value="pt">Portuguese</option>
          <option value="ru">Russian</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ar">Arabic</option>
          <option value="lv">Latvian</option>
        </select>
      </div>
    </div>

    <button class="btn-primary" id="submit-btn" onclick="submit()">Transcribe</button>
  </div>

  <div class="card status-card" id="status-card">
    <p class="status-text" id="status-text"><span class="spinner"></span>Starting...</p>
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="card result-card" id="result-card">
    <textarea id="result-text" readonly></textarea>
    <div class="result-actions">
      <button class="btn-sm" onclick="copyResult()">Copy</button>
      <button class="btn-sm" onclick="downloadResult()">Download all</button>
    </div>
    <div class="batch-downloads" id="batch-downloads"></div>
  </div>
</div>

<script>
let currentTab = 'url';
let currentFormat = 'txt';
let currentTitle = 'transcription';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((el, i) =>
    el.classList.toggle('active', ['url', 'file'][i] === tab));
  document.getElementById('tab-url').style.display = tab === 'url' ? '' : 'none';
  document.getElementById('tab-file').style.display = tab === 'file' ? '' : 'none';
}

async function submit() {
  const btn = document.getElementById('submit-btn');
  currentFormat = document.getElementById('format-select').value;

  const fd = new FormData();
  fd.append('model', document.getElementById('model-select').value);
  fd.append('output_format', currentFormat);
  const lang = document.getElementById('lang-select').value;
  if (lang) fd.append('language', lang);

  if (currentTab === 'url') {
    const url = document.getElementById('url-input').value.trim();
    if (!url) return;
    fd.append('source_type', 'url');
    fd.append('url', url);
  } else {
    const files = document.getElementById('file-input').files;
    if (!files.length) return;
    fd.append('source_type', 'file');
    for (const f of files) fd.append('files', f);
  }

  btn.disabled = true;
  setStatus('Submitting...');
  updateProgress(null);
  showCard('status-card', true);
  showCard('result-card', false);

  try {
    const res = await fetch('/transcribe', { method: 'POST', body: fd });
    const data = await res.json();
    if (!data.job_id) { setStatus(data.detail || 'Error', true); btn.disabled = false; return; }
    listenStatus(data.job_id, btn);
  } catch (e) {
    setStatus(e.message, true);
    btn.disabled = false;
  }
}

function listenStatus(jobId, btn) {
  const es = new EventSource(`/status/${jobId}`);
  es.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.status === 'done') {
      es.close();
      updateProgress(100);
      setStatus('Done');
      showResult(d.result, d.title || '', d.results || null);
      btn.disabled = false;
    } else if (d.status === 'error') {
      es.close();
      updateProgress(null);
      setStatus(d.error || 'Unknown error', true);
      btn.disabled = false;
    } else {
      if (d.progress != null) updateProgress(d.progress);
      setStatus(d.status_text || d.status);
    }
  };
  es.onerror = () => { es.close(); btn.disabled = false; };
}

function setStatus(msg, isError = false) {
  const el = document.getElementById('status-text');
  el.className = 'status-text' + (isError ? ' error' : '');
  el.innerHTML = isError ? msg : `<span class="spinner"></span>${msg}`;
  if (isError || msg === 'Done') el.innerHTML = msg;
}

function showCard(id, visible) {
  const el = document.getElementById(id);
  el.classList.toggle('visible', visible);
}

function updateProgress(pct) {
  const wrap = document.getElementById('progress-wrap');
  const bar = document.getElementById('progress-bar');
  if (pct == null) { wrap.style.display = 'none'; bar.style.width = '0%'; return; }
  wrap.style.display = '';
  bar.style.width = pct + '%';
}

function showResult(text, title, results) {
  document.getElementById('result-text').value = text;
  currentTitle = title || 'transcription';
  const batchDiv = document.getElementById('batch-downloads');
  batchDiv.innerHTML = '';
  if (results && results.length > 1) {
    results.forEach(r => {
      const btn = document.createElement('button');
      btn.className = 'btn-sm';
      btn.textContent = `↓ ${r.name}`;
      btn.onclick = () => downloadText(r.text, r.name);
      batchDiv.appendChild(btn);
    });
  }
  showCard('result-card', true);
}

function copyResult() {
  navigator.clipboard.writeText(document.getElementById('result-text').value);
}

function downloadText(text, name) {
  const ext = currentFormat === 'srt' ? 'srt' : 'txt';
  const safeName = name.replace(/[<>:"/\\|?*]/g, '').trim().replace(/\s+/g, '_').slice(0, 80) || 'transcription';
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([text], { type: 'text/plain' })),
    download: `${safeName}.${ext}`,
  });
  a.click();
}

function downloadResult() {
  downloadText(document.getElementById('result-text').value, currentTitle);
}
</script>
</body>
</html>
